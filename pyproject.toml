[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "owlvigil"
version = "0.2.0"
description = "Python SDK for OwlVigil Gateway and Management APIs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "OwlVigil" }]
maintainers = [{ name = "OwlVigil" }]
keywords = ["owlvigil", "ai", "gateway", "openai", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/Syrovex/owlvigil_sdk_python"
Repository = "https://github.com/Syrovex/owlvigil_sdk_python"
Issues = "https://github.com/Syrovex/owlvigil_sdk_python/issues"
Changelog = "https://github.com/Syrovex/owlvigil_sdk_python/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Syrovex/owlvigil_sdk_python#readme"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
release = ["build>=1.2,<2", "twine>=5,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/owlvigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "contracts", "scripts", "*.md", "LICENSE", "pyproject.toml"]
